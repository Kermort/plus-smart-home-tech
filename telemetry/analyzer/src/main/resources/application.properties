spring.output.ansi.enabled=ALWAYS

analyzer.kafka.consumer.topics.hubs-events=telemetry.hubs.v1
analyzer.kafka.consumer.topics.hub-snapshots=telemetry.snapshots.v1

analyzer.kafka.properties.bootstrap-servers=localhost:9092
analyzer.kafka.properties.group-id.hubs=analyzer.hubs
analyzer.kafka.properties.group-id.snapshots=analyzer.snapshots
analyzer.kafka.properties.auto-offset-reset=earliest
analyzer.kafka.properties.enable-auto-commit=false
analyzer.kafka.properties.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
analyzer.kafka.properties.value-deserializer.hubs=ru.yandex.practicum.kafka.telemetry.event.deserializer.HubEventDeserializer
analyzer.kafka.properties.value-deserializer.snapshots=ru.yandex.practicum.kafka.telemetry.event.deserializer.SensorsSnapshotDeserializer

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password

spring.sql.init.mode=always

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.dll-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate=ERROR

grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.enableKeepAlive=true
grpc.client.hub-router.keepAliveWithoutCalls=true
grpc.client.hub-router.negotiationType=plaintext

